const COLORS = [
  { key: "red", label: "Č", hex: "#E5484D" },
  { key: "yellow", label: "Ž", hex: "#F5C518" },
  { key: "green", label: "Z", hex: "#3FB950" },
  { key: "blue", label: "M", hex: "#3B82F6" },
  { key: "white", label: "B", hex: "#F2F2F2" },
];
const NUMBERS = [1, 2, 3, 4, 5];
const STORAGE_KEY = "hanabi-hand-v4";
const DOUBLE_TAP_MS = 500;

function freshCard(id) {
  return {
    id,
    color: Object.fromEntries(COLORS.map((c) => [c.key, "off"])),
    number: Object.fromEntries(NUMBERS.map((n) => [n, "off"])),
  };
}

function countStatus(obj, status) {
  return Object.values(obj).filter((v) => v === status).length;
}

function optionStyle(status, hex, textOnColor) {
  if (status === "on") {
    return { background: hex, color: textOnColor, border: "none", textDecoration: "none" };
  }
  if (status === "excluded") {
    return {
      background: "#1a0d10",
      color: "#7a3540",
      border: "1px dashed #4a1620",
      textDecoration: "line-through",
    };
  }
  return { background: "#08091a", color: "#2a2d52", border: "1px solid #16182f", textDecoration: "none" };
}

function OptionButton({ status, onTap, onHold, style, children }) {
  const clickTimerRef = useRef(null);

  function handleClick() {
    if (clickTimerRef.current) {
      clearTimeout(clickTimerRef.current);
      clickTimerRef.current = null;
      onHold();
    } else {
      onTap();
      clickTimerRef.current = setTimeout(() => {
        clickTimerRef.current = null;
      }, DOUBLE_TAP_MS);
    }
  }

  return (
    <button
      onClick={handleClick}
      className="aspect-square rounded-lg flex items-center justify-center text-sm font-bold transition"
      style={{ ...style, userSelect: "none", WebkitTouchCallout: "none", touchAction: "manipulation" }}
    >
      {children}
    </button>
  );
}

function HanabiNotebook() {
  const [cards, setCards] = useState([1, 2, 3, 4, 5].map(freshCard));
  const [loaded, setLoaded] = useState(false);
  const nextId = useRef(6);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length) {
          setCards(parsed);
          nextId.current = Math.max(...parsed.map((c) => c.id)) + 1;
        }
      }
    } catch (e) {}
    setLoaded(true);
  }, []);

  useEffect(() => {
    if (!loaded) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
    } catch (e) {}
  }, [cards, loaded]);

  function tapColor(cardId, key) {
    setCards((cs) =>
      cs.map((c) =>
        c.id === cardId ? { ...c, color: { ...c.color, [key]: c.color[key] === "on" ? "off" : "on" } } : c
      )
    );
  }
  function holdColor(cardId, key) {
    setCards((cs) =>
      cs.map((c) =>
        c.id === cardId
          ? { ...c, color: { ...c.color, [key]: c.color[key] === "excluded" ? "off" : "excluded" } }
          : c
      )
    );
  }
  function tapNumber(cardId, n) {
    setCards((cs) =>
      cs.map((c) => (c.id === cardId ? { ...c, number: { ...c.number, [n]: c.number[n] === "on" ? "off" : "on" } } : c))
    );
  }
  function holdNumber(cardId, n) {
    setCards((cs) =>
      cs.map((c) =>
        c.id === cardId
          ? { ...c, number: { ...c.number, [n]: c.number[n] === "excluded" ? "off" : "excluded" } }
          : c
      )
    );
  }

  function resetCard(cardId) {
    setCards((cs) => cs.map((c) => (c.id === cardId ? freshCard(cardId) : c)));
  }
  function removeCard(cardId) {
    setCards((cs) => cs.filter((c) => c.id !== cardId));
  }
  function addCard() {
    setCards((cs) => [...cs, freshCard(nextId.current++)]);
  }
  function clearAll() {
    setCards([]);
  }

  return (
    <div
      className="min-h-screen w-full flex flex-col items-center px-4 py-6"
      style={{
        background: "radial-gradient(ellipse at top, #10122a 0%, #060713 65%, #030308 100%)",
        fontFamily: "'Segoe UI', system-ui, -apple-system, sans-serif",
        touchAction: "manipulation",
      }}
    >
      <div className="w-full max-w-md">
        <img
          src={LOGO_SRC}
          alt="Hanabi"
          className="w-full max-w-xs mx-auto mb-5"
          style={{ filter: "drop-shadow(0 0 14px rgba(143,180,255,0.25))" }}
        />

        <div className="flex gap-2 mb-5">
          <button
            onClick={addCard}
            className="flex-1 rounded-xl py-2 font-semibold text-sm active:scale-95 transition"
            style={{ background: "#1c2454", color: "#8fb4ff", border: "1px solid #2d3a7a" }}
          >
            + Nová karta
          </button>
          <button
            onClick={clearAll}
            className="rounded-xl px-4 py-2 font-semibold text-sm active:scale-95 transition"
            style={{ background: "#12142a", color: "#4a5178", border: "1px solid #1e2148" }}
          >
            Vyčistit
          </button>
        </div>

        <div className="flex flex-col gap-4">
          {cards.length === 0 && (
            <div
              className="rounded-2xl p-6 text-center text-sm"
              style={{ background: "#0c0d1e", color: "#3a3f66", border: "1px dashed #1e2148" }}
            >
              Ruka je prázdná. Přidej kartu tlačítkem výše.
            </div>
          )}

          {cards.map((card, index) => {
            const resolved = countStatus(card.color, "on") === 1 && countStatus(card.number, "on") === 1;
            const resolvedColorKey = resolved ? Object.keys(card.color).find((k) => card.color[k] === "on") : null;
            const resolvedColor = resolvedColorKey ? COLORS.find((c) => c.key === resolvedColorKey) : null;
            const resolvedNumber = resolved ? Object.keys(card.number).find((k) => card.number[k] === "on") : null;

            return (
              <div
                key={card.id}
                className="rounded-2xl p-4 transition"
                style={{
                  background: resolved
                    ? `linear-gradient(135deg, ${resolvedColor.hex}1a, #0c0d1e)`
                    : "#0c0d1e",
                  border: resolved ? `1.5px solid ${resolvedColor.hex}` : "1px solid #1a1c3a",
                  boxShadow: resolved ? `0 0 24px ${resolvedColor.hex}30` : "none",
                }}
              >
                <div className="flex items-center justify-between mb-3">
                  <span
                    className="text-xs font-semibold uppercase tracking-wider"
                    style={{ color: resolved ? resolvedColor.hex : "#3a3f66" }}
                  >
                    {resolved ? `Karta ${index + 1} — ${resolvedColor.label} ${resolvedNumber}` : `Karta ${index + 1}`}
                  </span>
                  <div className="flex gap-3">
                    <button onClick={() => resetCard(card.id)} className="text-xs" style={{ color: "#4a5178" }}>
                      reset
                    </button>
                    <button onClick={() => removeCard(card.id)} className="text-xs" style={{ color: "#E5484D" }}>
                      odebrat
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-5 gap-2 mb-2">
                  {COLORS.map((c) => (
                    <OptionButton
                      key={c.key}
                      status={card.color[c.key]}
                      onTap={() => tapColor(card.id, c.key)}
                      onHold={() => holdColor(card.id, c.key)}
                      style={optionStyle(card.color[c.key], c.hex, c.key === "white" || c.key === "yellow" ? "#0d1024" : "#fff")}
                    >
                      {c.label}
                    </OptionButton>
                  ))}
                </div>

                <div className="grid grid-cols-5 gap-2">
                  {NUMBERS.map((n) => (
                    <OptionButton
                      key={n}
                      status={card.number[n]}
                      onTap={() => tapNumber(card.id, n)}
                      onHold={() => holdNumber(card.id, n)}
                      style={optionStyle(card.number[n], "#3B82F6", "#fff")}
                    >
                      {n}
                    </OptionButton>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<HanabiNotebook />);
</script>
</body>
</html>
