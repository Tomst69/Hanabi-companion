<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Hanabi Notebook</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #030308; touch-action: manipulation; }
  #root { min-height: 100vh; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  .app-shell {
    min-height: 100vh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1.5rem 1rem;
    transition: background 0.2s ease;
  }
  .app-inner { width: 100%; max-width: 28rem; }

  .logo {
    width: 100%;
    max-width: 20rem;
    display: block;
    margin: 0 auto 1.25rem auto;
  }

  .theme-btn {
    border-radius: 0.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    cursor: pointer;
    transition: transform 0.1s ease;
    padding: 0.5rem 0.25rem;
  }
  .theme-btn:active { transform: scale(0.9); }

  .toolbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-bottom: 1.25rem; }
  .btn {
    border-radius: 0.75rem;
    padding: 0.5rem 0.25rem;
    font-weight: 600;
    font-size: 0.875rem;
    cursor: pointer;
    transition: transform 0.1s ease;
    text-align: center;
  }
  .btn:active { transform: scale(0.95); }

  .card-list { display: flex; flex-direction: column; gap: 1rem; }

  .empty-state {
    border-radius: 1rem;
    padding: 1.5rem;
    text-align: center;
    font-size: 0.875rem;
  }

  .card { border-radius: 1rem; padding: 1rem; transition: all 0.15s ease; }

  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
  .card-title { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .card-actions { display: flex; align-items: center; gap: 0.75rem; }

  .multi-btn {
    border-radius: 999px;
    padding: 0.375rem 0.75rem;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
  }

  .link-btn { font-size: 0.75rem; background: none; border: none; cursor: pointer; padding: 0; }

  .arrow-btn {
    font-size: 0.75rem;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.15rem 0.35rem;
    line-height: 1;
  }
  .arrow-btn:disabled { cursor: default; }
  .arrow-btn:active:not(:disabled) { transform: scale(0.85); }

  .opt-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0.5rem; }
  .mb-2 { margin-bottom: 0.5rem; }

  .opt-btn {
    aspect-ratio: 1 / 1;
    border-radius: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.875rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.1s ease;
  }
</style>
</head>
<body>
<div id="root"></div>
